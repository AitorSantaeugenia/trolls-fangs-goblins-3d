<!doctype html>
<html><head><meta charset="utf-8"><title>Iconos de artilugios</title>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><script type="module">
// Herramienta: dibuja un artilugio de Tuerca (?k=trap|turret) para generar su icono (tools/gadgeticons.cjs)
import * as THREE from 'three';
import { createGadget, SCALE } from '/js/gadgets.js';
const q = new URLSearchParams(location.search);
const kind = q.get('k') || 'turret';
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(256, 256);
r.setClearColor(0x000000, 0);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.add(new THREE.HemisphereLight(0xfff2dc, 0x3a2a30, 1.6));
const key = new THREE.DirectionalLight(0xffe0b0, 3); key.position.set(3, 5, 4); s.add(key);
const rim = new THREE.DirectionalLight(0xffb03a, 2.5); rim.position.set(-3, 2, -3); s.add(rim);
const g = createGadget(kind);
g.obj.scale.setScalar(1 / SCALE[kind]); // el icono se encuadra con el tamaño sin escalar
s.add(g.obj);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
if (kind === 'trap') { cam.position.set(0, 3.4, 3.3); cam.lookAt(0, 0.05, 0); }
else { g.head.rotation.y = -0.7; cam.position.set(2.9, 2.6, 4.2); cam.lookAt(0, 0.85, 0); }
r.render(s, cam);
window.ready = true;
</script></body></html>
